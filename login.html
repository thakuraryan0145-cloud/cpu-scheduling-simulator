<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In &amp; Account · CPU Scheduling Simulator</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%222%22 y=%222%22 width=%2212%22 height=%2212%22 rx=%222%22 fill=%22%236c8cff%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-page">

  <header class="auth-header">
    <div class="brand">
      <span class="logo">⚙</span>
      <div>
        <h1 style="font-size: 1.15rem; margin: 0; background: linear-gradient(90deg, #8fa6ff, #43d9ad); -webkit-background-clip: text; background-clip: text; color: transparent;">
          CPU Scheduling Simulator
        </h1>
        <p class="subtitle" style="font-size: 0.75rem; margin: 0;">Secure Account Authentication</p>
      </div>
    </div>
    <a href="index.html" class="btn small" style="text-decoration: none; display: inline-flex; align-items: center; gap: 0.35rem;">
      <span>← Back to Simulator</span>
    </a>
  </header>

  <main class="auth-container">
    <div class="auth-card">

      <div class="auth-brand">
        <span class="logo">⚙</span>
        <h2 id="auth-title">Welcome Back</h2>
        <p id="auth-subtitle">Sign in to save simulations, generate PDF reports, and view analytics</p>
      </div>

      <div class="auth-tabs" role="tablist">
        <button id="tab-login-btn" class="auth-tab-btn active" type="button">Sign In</button>
        <button id="tab-register-btn" class="auth-tab-btn" type="button">Create Account</button>
        <button id="tab-reset-btn" class="auth-tab-btn" type="button">Reset Password</button>
      </div>

      <div id="auth-alert" class="auth-alert"></div>

      <!-- ================= SIGN IN FORM ================= -->
      <form id="form-login" class="auth-form active" autocomplete="on">
        <div class="auth-field">
          <label for="login-identifier">Username or Email</label>
          <div class="input-with-icon">
            <input id="login-identifier" type="text" placeholder="Enter your username or email" required autocomplete="username" />
          </div>
        </div>

        <div class="auth-field">
          <label for="login-password">Password</label>
          <div class="input-with-icon">
            <input id="login-password" type="password" placeholder="Enter your password" required autocomplete="current-password" />
            <button type="button" class="toggle-pwd" id="toggle-login-pwd" title="Show or hide password">👁</button>
          </div>
        </div>

        <button type="submit" id="btn-login-submit" class="btn primary big">
          Sign In
        </button>
      </form>

      <!-- ================= REGISTER FORM ================= -->
      <form id="form-register" class="auth-form" autocomplete="on">
        <div class="auth-field">
          <label for="reg-name">Full Name</label>
          <div class="input-with-icon">
            <input id="reg-name" type="text" placeholder="e.g. Alex Turing" required autocomplete="name" />
          </div>
        </div>

        <div class="auth-field">
          <label for="reg-username">Username</label>
          <div class="input-with-icon">
            <input id="reg-username" type="text" placeholder="Choose a unique username (3+ chars)" minlength="3" required autocomplete="username" />
          </div>
        </div>

        <div class="auth-field">
          <label for="reg-email">Email Address</label>
          <div class="input-with-icon">
            <input id="reg-email" type="email" placeholder="alex@university.edu" required autocomplete="email" />
          </div>
        </div>

        <div class="auth-field">
          <label for="reg-password">Password</label>
          <div class="input-with-icon">
            <input id="reg-password" type="password" placeholder="At least 8 characters (letters + numbers)" minlength="8" required autocomplete="new-password" />
            <button type="button" class="toggle-pwd" id="toggle-reg-pwd" title="Show or hide password">👁</button>
          </div>
        </div>

        <div class="auth-field">
          <label for="reg-confirm">Confirm Password</label>
          <div class="input-with-icon">
            <input id="reg-confirm" type="password" placeholder="Re-enter your password" required autocomplete="new-password" />
          </div>
        </div>

        <button type="submit" id="btn-reg-submit" class="btn primary big">
          Create Account &amp; Sign In
        </button>
      </form>

      <!-- ================= PASSWORD RESET FORM ================= -->
      <form id="form-reset" class="auth-form" autocomplete="off">
        <div class="auth-field">
          <label for="reset-email">Account Email</label>
          <div class="input-with-icon">
            <input id="reset-email" type="email" placeholder="Enter your registered email" />
          </div>
        </div>
        <button type="button" id="btn-send-reset" class="btn primary big">
          Send Reset Link
        </button>

        <hr style="border: 0; border-top: 1px solid var(--line); margin: 0.5rem 0;" />

        <div class="auth-field">
          <label for="reset-token">Reset Token (from email / link)</label>
          <div class="input-with-icon">
            <input id="reset-token" type="text" placeholder="Paste your password reset token" />
          </div>
        </div>
        <div class="auth-field">
          <label for="reset-new-password">New Password</label>
          <div class="input-with-icon">
            <input id="reset-new-password" type="password" placeholder="At least 8 characters" minlength="8" />
          </div>
        </div>
        <button type="submit" id="btn-confirm-reset" class="btn big">
          Confirm New Password
        </button>
      </form>

      <div class="auth-footer-nav">
        <span>Just exploring the simulator? </span>
        <a href="index.html">Continue as Guest →</a>
      </div>
    </div>
  </main>

  <footer>
    CPU Process Scheduling Simulator · Secure Authentication &amp; Session Manager
  </footer>

  <script src="js/auth.js"></script>
  <script>
    'use strict';

    const tabLoginBtn = document.getElementById('tab-login-btn');
    const tabRegBtn = document.getElementById('tab-register-btn');
    const tabResetBtn = document.getElementById('tab-reset-btn');
    const formLogin = document.getElementById('form-login');
    const formRegister = document.getElementById('form-register');
    const formReset = document.getElementById('form-reset');
    const authTitle = document.getElementById('auth-title');
    const authSubtitle = document.getElementById('auth-subtitle');
    const alertBox = document.getElementById('auth-alert');

    function setTab(tab) {
      clearAlert();
      [tabLoginBtn, tabRegBtn, tabResetBtn].forEach(b => b.classList.remove('active'));
      [formLogin, formRegister, formReset].forEach(f => f.classList.remove('active'));

      if (tab === 'login') {
        tabLoginBtn.classList.add('active');
        formLogin.classList.add('active');
        authTitle.textContent = 'Welcome Back';
        authSubtitle.textContent = 'Sign in to save simulations, generate PDF reports, and view analytics';
      } else if (tab === 'register') {
        tabRegBtn.classList.add('active');
        formRegister.classList.add('active');
        authTitle.textContent = 'Create Account';
        authSubtitle.textContent = 'Register a Student account with secure password hashing';
      } else {
        tabResetBtn.classList.add('active');
        formReset.classList.add('active');
        authTitle.textContent = 'Reset Password';
        authSubtitle.textContent = 'Request a password reset token or confirm a new password';
      }
    }

    tabLoginBtn.addEventListener('click', () => setTab('login'));
    tabRegBtn.addEventListener('click', () => setTab('register'));
    tabResetBtn.addEventListener('click', () => setTab('reset'));

    function showAlert(msg, type = 'error') {
      alertBox.textContent = msg;
      alertBox.className = `auth-alert ${type}`;
    }

    function clearAlert() {
      alertBox.textContent = '';
      alertBox.className = 'auth-alert';
    }

    function setupToggle(btnId, inputId) {
      const btn = document.getElementById(btnId);
      const inp = document.getElementById(inputId);
      if (!btn || !inp) return;
      btn.addEventListener('click', () => {
        inp.type = inp.type === 'password' ? 'text' : 'password';
      });
    }
    setupToggle('toggle-login-pwd', 'login-password');
    setupToggle('toggle-reg-pwd', 'reg-password');

    formLogin.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlert();
      const identifier = document.getElementById('login-identifier').value.trim();
      const password = document.getElementById('login-password').value;
      const res = await Auth.login({ identifier, password });
      if (res.success) {
        showAlert(res.message || 'Signed in! Redirecting...', 'success');
        setTimeout(() => { window.location.href = 'index.html'; }, 500);
      } else {
        showAlert(res.message, 'error');
      }
    });

    formRegister.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlert();
      const name = document.getElementById('reg-name').value.trim();
      const username = document.getElementById('reg-username').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirm = document.getElementById('reg-confirm').value;

      if (password !== confirm) {
        showAlert('Passwords do not match.', 'error');
        return;
      }

      const res = await Auth.register({ name, username, email, password });
      if (res.success) {
        showAlert(res.message || 'Account created! Redirecting...', 'success');
        setTimeout(() => { window.location.href = 'index.html'; }, 700);
      } else {
        showAlert(res.message, 'error');
      }
    });

    document.getElementById('btn-send-reset').addEventListener('click', async () => {
      clearAlert();
      const email = document.getElementById('reset-email').value.trim();
      if (!email) {
        showAlert('Please enter your email address.', 'error');
        return;
      }
      const res = await Auth.requestPasswordReset(email);
      showAlert(res.message, res.success ? 'success' : 'error');
    });

    formReset.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlert();
      const token = document.getElementById('reset-token').value.trim();
      const newPassword = document.getElementById('reset-new-password').value;
      if (!token || !newPassword) {
        showAlert('Please provide both the reset token and a new password.', 'error');
        return;
      }
      const res = await Auth.confirmPasswordReset(token, newPassword);
      if (res.success) {
        showAlert(res.message, 'success');
        setTimeout(() => setTab('login'), 1000);
      } else {
        showAlert(res.message, 'error');
      }
    });

    // Handle URL query params: ?verify_token=... or ?reset_token=...
    (async function handleQueryTokens() {
      const params = new URLSearchParams(window.location.search);
      const verifyToken = params.get('verify_token');
      const resetToken = params.get('reset_token');
      if (verifyToken) {
        const res = await Auth.verifyEmail(verifyToken);
        showAlert(res.message, res.success ? 'success' : 'error');
      } else if (resetToken) {
        setTab('reset');
        document.getElementById('reset-token').value = resetToken;
        showAlert('Enter your new password below to complete the reset.', 'success');
      }
    })();
  </script>
</body>
</html>
